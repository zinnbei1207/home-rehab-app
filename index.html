<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>おうちリハビリ</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#172033;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;padding:24px 16px 48px}h1{margin:0 0 6px;font-size:28px}.date{color:#667085;margin-bottom:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.tab,.btn{border:1px solid #d9dee7;background:#fff;border-radius:12px;padding:12px;font-weight:700}.tab.active,.primary{background:#172033;color:#fff}.box,.card,.history{background:#fff;border-radius:18px;box-shadow:0 4px 18px #0000000d}.box{padding:18px;margin-bottom:16px}.progress-top{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e8ecf1;border-radius:999px;margin-top:12px;overflow:hidden}.bar div{height:100%;background:#172033;transition:.25s}.card{padding:18px;margin:12px 0}.card.done{outline:2px solid #172033}.card h2{font-size:19px;margin:0 0 4px}.target{color:#667085;margin:0 0 12px}.memo-toggle{width:100%;border:0;background:#f6f7f9;border-radius:14px;padding:12px;text-align:left;font-weight:800;color:#596273;display:flex;justify-content:space-between}.memo-body{display:none;background:#f6f7f9;border-radius:0 0 14px 14px;padding:4px 12px 12px;margin-top:-8px;margin-bottom:14px}.memo-body.open{display:block}.memo-text{white-space:pre-wrap;line-height:1.55;font-size:14px}.edit{border:0;background:transparent;color:#3b65a7;font-weight:700}.editor{display:none}.editor.open{display:block}.editor textarea,.rest textarea,.daily textarea{width:100%;min-height:76px;border:1px solid #cfd5df;border-radius:10px;padding:10px;font:inherit}.actions{display:flex;gap:8px;margin-top:8px}.small{border:1px solid #cfd5df;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700}.session{margin-top:14px}.session-title{font-size:14px;font-weight:800;color:#596273;margin:0 0 7px}.sets{display:grid;grid-template-columns:1fr 1fr;gap:10px}.set{border:1px solid #d9dee7;background:#fff;border-radius:14px;padding:14px 8px;font-weight:700}.set.checked{background:#172033;color:#fff}.rest,.daily{margin-top:16px}.rest-options{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.reason{border:1px solid #d9dee7;background:#fff;border-radius:999px;padding:8px 12px}.reason.active{background:#172033;color:#fff}.rest-banner{background:#fff7df;border-radius:14px;padding:14px;margin-bottom:16px;font-weight:700}.complete{display:none;text-align:center;padding:18px;margin-top:16px;background:#fff;border-radius:18px;font-weight:800}.complete.show{display:block}.saved{font-size:13px;color:#667085;margin-left:8px}.history{padding:8px 16px}.hist-row{padding:14px 2px;border-bottom:1px solid #edf0f4}.hist-row:last-child{border-bottom:0}.hist-top{display:flex;justify-content:space-between;gap:10px;font-weight:800}.hist-note{color:#667085;font-size:14px;margin-top:5px;white-space:pre-wrap}.note{text-align:center;color:#7b8494;font-size:12px;margin-top:18px}.hidden{display:none}button{font:inherit;cursor:pointer}</style></head><body><main class="app"><h1>🏠 おうちリハビリ</h1><div class="date" id="date"></div><div class="tabs"><button class="tab active" data-view="today">今日</button><button class="tab" data-view="history">📊 履歴</button></div><section id="todayView"><div class="box"><div class="progress-top"><span>今日の達成度</span><span id="score"></span></div><div class="bar"><div id="bar"></div></div></div><div id="restBanner"></div><div id="list"></div><div class="complete" id="complete">🎉 今日のリハビリ完了！</div><div class="box daily"><strong>📝 今日のメモ</strong><p class="target">途中までの日の理由や、その日の様子を残せます。</p><textarea id="dailyNote" placeholder="例：今日はバイトのため1回分だけ"></textarea><div class="actions"><button class="btn primary" id="saveDaily">メモを保存</button><span class="saved" id="savedMsg"></span></div></div><div class="box rest"><strong>今日はできない / お休みにする</strong><div class="rest-options" id="reasons"></div><textarea id="restNote" placeholder="理由を自由に書く（例：ライブを見に行くため）"></textarea><div class="actions"><button class="btn primary" id="saveRest">お休みとして記録</button><button class="btn" id="clearRest">解除</button></div></div></section><section id="historyView" class="hidden"><div class="history" id="history"></div></section><div class="note">記録とメモは、この端末のブラウザに保存されます。</div></main><script>
const exercises=[{name:'お尻上げ',target:'10回 × 2セット × 1日2回',memo:'座るようにしてお尻を下げる。垂直に。'},{name:'横向きで脚を上げる運動',target:'10回 × 2セット × 1日2回',memo:'自分が分かりやすい説明を追加できます。'},{name:'座って膝を伸ばす運動',target:'10回 × 2セット × 1日2回',memo:'自分が分かりやすい説明を追加できます。'},{name:'立って踵を上げる運動',target:'10回 × 2セット × 1日2回',memo:'自分が分かりやすい説明を追加できます。'}];const reasons=['予定・外出','体調','ライブ','その他'],pad=n=>String(n).padStart(2,'0'),now=new Date(),dayKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`,stateKey='homeRehab:'+dayKey,memoKey='homeRehab:memos',restKey='homeRehab:rest:'+dayKey,dailyKey='homeRehab:daily:'+dayKey;document.getElementById('date').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;let rawState=JSON.parse(localStorage.getItem(stateKey)||'null');let state=rawState||exercises.map(()=>[false,false,false,false]);state=exercises.map((_,i)=>{let x=Array.isArray(state[i])?state[i]:[];return x.length>=4?x.slice(0,4):[!!x[0],!!x[1],false,false]});localStorage.setItem(stateKey,JSON.stringify(state));let memos=JSON.parse(localStorage.getItem(memoKey)||'null')||exercises.map(x=>x.memo);let rest=JSON.parse(localStorage.getItem(restKey)||'null'),dailyNote=localStorage.getItem(dailyKey)||'',selectedReason=rest?.reason||'',openMemo=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const list=document.getElementById('list');list.innerHTML='';exercises.forEach((ex,i)=>{let d=state[i].every(Boolean),o=openMemo===i,c=document.createElement('section');c.className='card'+(d?' done':'');let sessionHtml=[0,1].map(r=>`<div class="session"><p class="session-title">${r===0?'☀️ 1回目':'🌙 2回目'}（10回 × 2セット）</p><div class="sets">${[0,1].map(s=>{let idx=r*2+s;return `<button class="set ${state[i][idx]?'checked':''}" data-i="${i}" data-s="${idx}">${state[i][idx]?'✓ ':''}${s+1}セット目</button>`}).join('')}</div></div>`).join('');c.innerHTML=`<h2>${i+1}. ${ex.name}</h2><p class="target">${ex.target}</p><button class="memo-toggle" data-toggle="${i}"><span>💡 やり方を見る</span><span>${o?'▲':'▼'}</span></button><div class="memo-body ${o?'open':''}"><p class="memo-text">${esc(memos[i])}</p><button class="edit" data-edit="${i}">✏️ メモを編集</button><div class="editor" id="editor-${i}"><textarea>${esc(memos[i])}</textarea><div class="actions"><button class="small primary" data-save="${i}">保存</button><button class="small" data-cancel="${i}">キャンセル</button></div></div></div>${sessionHtml}`;list.appendChild(c)});let doneSets=state.reduce((a,x)=>a+x.filter(Boolean).length,0),totalSets=exercises.length*4,doneExercises=state.filter(x=>x.every(Boolean)).length;document.getElementById('score').textContent=`${doneSets} / ${totalSets} セット`;document.getElementById('bar').style.width=`${doneSets/totalSets*100}%`;document.getElementById('complete').classList.toggle('show',doneExercises===exercises.length&&!rest);document.getElementById('restBanner').innerHTML=rest?`<div class="rest-banner">➖ 今日はお休み：${esc(rest.reason)}${rest.note?' — '+esc(rest.note):''}</div>`:'';document.getElementById('restNote').value=rest?.note||'';document.getElementById('dailyNote').value=dailyNote;document.getElementById('reasons').innerHTML=reasons.map(r=>`<button class="reason ${selectedReason===r?'active':''}" data-reason="${r}">${r}</button>`).join('');bind();renderHistory()}
function bind(){document.querySelectorAll('.set').forEach(b=>b.onclick=()=>{state[+b.dataset.i][+b.dataset.s]=!state[+b.dataset.i][+b.dataset.s];localStorage.setItem(stateKey,JSON.stringify(state));if(rest){rest=null;localStorage.removeItem(restKey)}render()});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let i=+b.dataset.toggle;openMemo=openMemo===i?null:i;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>document.getElementById('editor-'+b.dataset.edit).classList.add('open'));document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>document.getElementById('editor-'+b.dataset.cancel).classList.remove('open'));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let i=+b.dataset.save;memos[i]=document.querySelector('#editor-'+i+' textarea').value.trim()||'（メモなし）';localStorage.setItem(memoKey,JSON.stringify(memos));openMemo=i;render()});document.querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>{selectedReason=b.dataset.reason;render()})}
document.getElementById('saveDaily').onclick=()=>{dailyNote=document.getElementById('dailyNote').value.trim();if(dailyNote)localStorage.setItem(dailyKey,dailyNote);else localStorage.removeItem(dailyKey);document.getElementById('savedMsg').textContent='保存しました ✓';setTimeout(()=>document.getElementById('savedMsg').textContent='',1500);renderHistory()};document.getElementById('saveRest').onclick=()=>{let note=document.getElementById('restNote').value.trim();if(!selectedReason&&note)selectedReason='その他';if(!selectedReason){alert('お休みの理由を選ぶか入力してね');return}rest={reason:selectedReason,note};localStorage.setItem(restKey,JSON.stringify(rest));render()};document.getElementById('clearRest').onclick=()=>{rest=null;selectedReason='';localStorage.removeItem(restKey);render()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.getElementById('todayView').classList.toggle('hidden',t.dataset.view!=='today');document.getElementById('historyView').classList.toggle('hidden',t.dataset.view!=='history');if(t.dataset.view==='history')renderHistory()});function normalize(s){if(!Array.isArray(s))return[];return s.map(x=>Array.isArray(x)?(x.length>=4?x.slice(0,4):[!!x[0],!!x[1],false,false]):[false,false,false,false])}function renderHistory(){let dates=new Set([dayKey]);for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i),m=k.match(/^homeRehab:(?:rest:|daily:)?(\d{4}-\d{2}-\d{2})$/);if(m)dates.add(m[1])}let rows=[...dates].map(d=>{let s=normalize(JSON.parse(localStorage.getItem('homeRehab:'+d)||'[]')),r=JSON.parse(localStorage.getItem('homeRehab:rest:'+d)||'null'),note=localStorage.getItem('homeRehab:daily:'+d)||'',sets=s.reduce((a,x)=>a+x.filter(Boolean).length,0),total=s.length?s.length*4:16;return{d,sets,total,r,note}}).sort((a,b)=>b.d.localeCompare(a.d));document.getElementById('history').innerHTML=rows.map(x=>`<div class="hist-row"><div class="hist-top"><span>${x.d.replaceAll('-','/')}</span><span>${x.r?'➖ お休み':x.sets===x.total?'✅ 完了':`🟡 ${x.sets} / ${x.total}セット`}</span></div>${x.r?`<div class="hist-note">${esc(x.r.reason)}${x.r.note?'：'+esc(x.r.note):''}</div>`:''}${x.note?`<div class="hist-note">📝 ${esc(x.note)}</div>`:''}</div>`).join('')}render();</script></body></html>
