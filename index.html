<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おうちリハビリ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:#172033;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;padding:24px 16px 48px}h1{margin:0 0 6px;font-size:28px}.date{color:#667085;margin-bottom:18px}.progress{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #0000000d}.progress-top{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e8ecf1;border-radius:999px;margin-top:12px;overflow:hidden}.bar>div{height:100%;width:0;background:#172033;border-radius:999px;transition:.25s}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0000000d}.card.done{outline:2px solid #172033}.card h2{font-size:19px;margin:0 0 4px}.target{color:#667085;margin:0 0 14px}.sets{display:grid;grid-template-columns:1fr 1fr;gap:10px}.set{border:1px solid #d9dee7;background:#fff;border-radius:14px;padding:14px 8px;font-size:16px;font-weight:700;cursor:pointer}.set.checked{background:#172033;color:#fff;border-color:#172033}.complete{display:none;text-align:center;background:#fff;border-radius:18px;padding:20px;margin-top:16px;font-size:20px;font-weight:800}.complete.show{display:block}.note{text-align:center;color:#7b8494;font-size:12px;margin-top:18px}button{font:inherit}
</style>
</head>
<body>
<main class="app">
<h1>🏠 おうちリハビリ</h1>
<div class="date" id="date"></div>
<section class="progress">
<div class="progress-top"><span>今日の達成度</span><span id="score">0 / 4</span></div>
<div class="bar"><div id="bar"></div></div>
</section>
<div id="list"></div>
<div class="complete" id="complete">🎉 今日のリハビリ完了！</div>
<div class="note">チェックはこの端末のブラウザに日付ごとに保存されます。</div>
</main>
<script>
const exercises=[
 {name:'お尻上げ',target:'10回 × 2セット'},
 {name:'横向きで脚を上げる運動',target:'10回 × 2セット'},
 {name:'座って膝を伸ばす運動',target:'10回 × 2セット'},
 {name:'立って踵を上げる運動',target:'10回 × 2セット'}
];
const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const dayKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
document.getElementById('date').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
const storageKey='homeRehab:'+dayKey;
let state=JSON.parse(localStorage.getItem(storageKey)||'null')||exercises.map(()=>[false,false]);
if(!Array.isArray(state)||state.length!==exercises.length) state=exercises.map(()=>[false,false]);
const list=document.getElementById('list');
function save(){localStorage.setItem(storageKey,JSON.stringify(state));}
function render(){
 list.innerHTML='';
 exercises.forEach((ex,i)=>{
  const card=document.createElement('section');
  const done=state[i].every(Boolean);
  card.className='card'+(done?' done':'');
  card.innerHTML=`<h2>${i+1}. ${ex.name}</h2><p class="target">${ex.target}</p><div class="sets">${[0,1].map(s=>`<button class="set ${state[i][s]?'checked':''}" data-i="${i}" data-s="${s}">${state[i][s]?'✓ ':''}${s+1}セット目</button>`).join('')}</div>`;
  list.appendChild(card);
 });
 const completed=state.filter(x=>x.every(Boolean)).length;
 document.getElementById('score').textContent=`${completed} / ${exercises.length}`;
 document.getElementById('bar').style.width=`${completed/exercises.length*100}%`;
 document.getElementById('complete').classList.toggle('show',completed===exercises.length);
 document.querySelectorAll('.set').forEach(btn=>btn.onclick=()=>{
  const i=Number(btn.dataset.i),s=Number(btn.dataset.s);
  state[i][s]=!state[i][s]; save(); render();
 });
}
render();
</script>
</body>
</html>
